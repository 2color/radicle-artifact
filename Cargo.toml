[workspace]
members = ["."]

[[bin]]
name = "rad-artifact"
path = "src/bin/rad-artifact/main.rs"
# The binary needs CID computation from local paths, which lives in the
# `share` module. Library consumers can still disable `share` to avoid the
# iroh/tokio/blake3 dep tree.
required-features = ["share"]

[package]
name = "radicle-artifact"
description = "Radicle Artifact Collaborative Object (COB)"
homepage = "https://radicle.dev"
repository = "https://radicle.network/nodes/iris.radicle.network/rad:z4VYyJ9KuwMNkXGQnmKuGPGKw3inv"
authors = ["Daniel Norman <daniel@norman.life>"]
license = "MIT OR Apache-2.0"
version = "0.14.0"
edition = "2021"
rust-version = "1.91"

[features]
default = ["share"]
share = [
    "dep:iroh",
    "dep:iroh-blobs",
    "dep:blake3",
    "dep:multihash",
    "dep:tokio",
    "dep:ureq",
    "dep:bytes",
    "dep:walkdir",
    "dep:dunce",
    "dep:indicatif",
    "dep:n0-future",
    "dep:data-encoding",
    "dep:log",
    "dep:structured-logger",
]

[dependencies]
cid = { version = "0.11", features = ["serde"] }
clap = { version = "4.5", features = ["derive", "wrap_help"] }
indexmap = { version = "2.7", features = ["serde"] }
nonempty = "0.11"
radicle = { version = "0.24" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
url = { version = "2.5", features = ["serde"] }

# Optional deps (share feature)
iroh = { version = "1.0.0-rc.0", optional = true }
iroh-blobs = { version = "0.101.0", optional = true }
blake3 = { version = "1", optional = true }
multihash = { version = "0.19", optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "signal", "net", "io-util", "time", "macros", "process", "sync"], optional = true }
ureq = { version = "3", optional = true }
bytes = { version = "1", optional = true }
walkdir = { version = "2", optional = true }
dunce = { version = "1", optional = true }
indicatif = { version = "0.17", optional = true }
inquire = { version = "0.7" }
n0-future = { version = "0.3", optional = true }
data-encoding = { version = "2.6", optional = true }
log = { version = "0.4", optional = true }
structured-logger = { version = "1", optional = true }

[dev-dependencies]
tempfile = "3"

[dev-dependencies.radicle]
version = "0.24"
features = ["test"]
