[workspace]
members = ["."]

[[bin]]
name = "rad-artifact"
path = "src/bin/rad-artifact.rs"
# The binary needs CID computation from local paths, which lives in the
# `share` module. Library consumers can still disable `share` to avoid the
# iroh/tokio/blake3 dep tree.
required-features = ["share"]

[package]
name = "radicle-artifact"
description = "Radicle Artifact Collaborative Object (COB)"
homepage = "https://radicle.xyz"
repository = "https://app.radicle.xyz/nodes/iris.radicle.xyz/rad:z4VYyJ9KuwMNkXGQnmKuGPGKw3inv"
authors = ["Daniel Norman <daniel@norman.life>"]
license = "MIT OR Apache-2.0"
version = "0.9.0"
edition = "2021"
rust-version = "1.84.0"

[features]
default = ["share"]
share = [
    "dep:iroh",
    "dep:iroh-blobs",
    "dep:blake3",
    "dep:multihash",
    "dep:tokio",
    "dep:ureq",
    "dep:bytes",
    "dep:walkdir",
    "dep:dunce",
    "dep:indicatif",
    "dep:n0-future",
]

[dependencies]
chrono = { version = "0.4", features = ["clock"] }
cid = { version = "0.11", features = ["serde"] }
clap = { version = "4.5", features = ["derive", "wrap_help"] }
indexmap = { version = "2.7", features = ["serde"] }
nonempty = "0.11.0"
radicle = { git = "https://rosa.radicle.xyz/z3gqcJUoA1n9HaHKufZs5FCSGazv5.git", rev = "b687817696bb6de77dd906a89750c2051b36d325" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
url = { version = "2.5", features = ["serde"] }

# Optional deps (share feature)
iroh = { version = "0.98.1", optional = true }
iroh-blobs = { version = "0.100", optional = true }
blake3 = { version = "1", optional = true }
multihash = { version = "0.19", optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "signal"], optional = true }
ureq = { version = "3", optional = true }
bytes = { version = "1", optional = true }
walkdir = { version = "2", optional = true }
dunce = { version = "1", optional = true }
indicatif = { version = "0.17", optional = true }
inquire = { version = "0.7" }
n0-future = { version = "0.3", optional = true }

[dev-dependencies]
tempfile = "3"

[dev-dependencies.radicle]
git = "https://rosa.radicle.xyz/z3gqcJUoA1n9HaHKufZs5FCSGazv5.git"
rev = "b687817696bb6de77dd906a89750c2051b36d325"
features = ["test"]
