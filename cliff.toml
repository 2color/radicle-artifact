# git-cliff configuration
# https://git-cliff.org/docs/configuration

[changelog]
header = """
# Changelog

All notable changes to this project will be documented in this file.

The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.1.0/),
and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).\n
"""
body = """
{%- macro remote_url() -%}
  https://radicle.network/nodes/iris.radicle.network/rad:z4VYyJ9KuwMNkXGQnmKuGPGKw3inv
{%- endmacro -%}

{% if version -%}
    ## [{{ version | trim_start_matches(pat="releases/") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else -%}
    ## [Unreleased]
{% endif -%}

{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | striptags | trim | upper_first }}
    {% for commit in commits %}
        * `{{ commit.id | truncate(length=7, end="") }}` {{ commit.message | split(pat="\n") | first | trim }} *<{{ commit.author.email }}>*\
    {% endfor %}
{% endfor %}\n
"""
trim = true

[git]
conventional_commits = false
filter_unconventional = false
split_commits = false
protect_breaking_commits = false
filter_commits = false
tag_pattern = "releases/[0-9].*"
sort_commits = "oldest"

commit_parsers = [
    { message = "^[Aa]dd", group = "Added" },
    { message = "^[Ss]upport", group = "Added" },
    { message = "^[Ii]mplement", group = "Added" },
    { message = "^[Ii]ntroduce", group = "Added" },
    { message = "^[Ii]nitial", group = "Added" },
    { message = "^[Ff]ix", group = "Fixed" },
    { message = "^[Rr]epair", group = "Fixed" },
    { message = "^[Cc]hange", group = "Changed" },
    { message = "^[Rr]e(factor|name|place|work)", group = "Changed" },
    { message = "^[Uu]pdate", group = "Changed" },
    { message = "^[Mm]ove", group = "Changed" },
    { message = "^[Rr]emove", group = "Removed" },
    { message = "^[Dd]elete", group = "Removed" },
    { message = "^[Dd]rop", group = "Removed" },
    { message = ".*", group = "Other" },
]
