# git-cliff configuration
# https://git-cliff.org/docs/configuration

[changelog]
header = """
# Changelog

All notable changes to this project will be documented in this file.

The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.1.0/),
and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).\n
"""
body = """
{%- macro remote_url() -%}
  https://radicle.network/nodes/iris.radicle.network/rad:z4VYyJ9KuwMNkXGQnmKuGPGKw3inv
{%- endmacro -%}

{% if version -%}
    ## [{{ version | trim_start_matches(pat="releases/") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else -%}
    ## [Unreleased]
{% endif -%}

{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | striptags | trim | upper_first }}
    {% for commit in commits %}
        * `{{ commit.id | truncate(length=7, end="") }}` {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | split(pat="\n") | first | trim }}{% if commit.breaking %} [**breaking**]{% endif %} *<{{ commit.author.email }}>*\
    {% endfor %}
{% endfor %}\n
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = false
split_commits = false
protect_breaking_commits = false
filter_commits = false
tag_pattern = "releases/[0-9].*"
sort_commits = "oldest"

# Map Conventional Commit types to Keep a Changelog sections.
# HTML comment prefixes order the sections; the body template strips them.
# Non-conventional commits (e.g. older history) fall through to "Other".
commit_parsers = [
    { message = "^feat", group = "<!-- 0 -->Added" },
    { message = "^refactor", group = "<!-- 1 -->Changed" },
    { message = "^perf", group = "<!-- 1 -->Changed" },
    { message = "^chore", group = "<!-- 1 -->Changed" },
    { message = "^fix", group = "<!-- 2 -->Fixed" },
    { message = "^revert", group = "<!-- 3 -->Removed" },
    { message = "^docs", group = "<!-- 4 -->Docs" },
    { message = "^style", skip = true },
    { message = ".*", group = "<!-- 9 -->Other" },
]
