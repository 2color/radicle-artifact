allow-branch = [
    "main",
    "HEAD",
]
sign-commit = true
sign-tag = true
push-remote = "rad"
release = true
publish = true
verify = true
push = true
push-options = []
# All crates version in lockstep via [workspace.package]; one release
# commit covers the whole workspace.
consolidate-commits = true
pre-release-commit-message = "chore(release): {{version}}"
tag-message = "Release version {{version}}"
tag-name = "releases/{{version}}"
# Tag once per release, from the lean crate only (see its release.toml);
# identical tags from four crates would collide.
tag = false
enable-features = []
enable-all-features = false
dependent-version = "upgrade"
metadata = "optional"
certs-source = "webpki"

[rate-limit]
new-packages = 5
existing-packages = 30
