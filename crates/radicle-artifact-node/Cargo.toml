[package]
name = "radicle-artifact-node"
description = "Seeding node for radicle artifacts: iroh-blobs store and blob serving daemon"
homepage.workspace = true
repository.workspace = true
authors.workspace = true
license.workspace = true
readme.workspace = true
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "rad-artifact-node"
path = "src/main.rs"

[dependencies]
blake3 = "1"
bytes = "1"
cid = { version = "0.11", features = ["serde"] }
dunce = "1"
iroh = { version = "1.2.0", features = ["unstable-net-report"] }
iroh-blobs = { version = "0.103.0" }
n0-future = { version = "0.3" }
radicle = { version = "0.25.1" }
radicle-artifact-client = { version = "0.20.0", path = "../radicle-artifact-client", features = ["tokio"] }
radicle-artifact-core = { version = "0.20.0", path = "../radicle-artifact-core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1", features = ["rt-multi-thread", "signal", "net", "io-util", "time", "macros", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
ureq = "3"
url = { version = "2.5", features = ["serde"] }

[dev-dependencies]
postcard = { version = "1", features = ["use-std"] }
tempfile = "3"

[dev-dependencies.radicle]
version = "0.25.1"
features = ["test"]
