[package]
name = "radicle-artifact-core"
description = "Shared substrate for radicle-artifact: control-socket protocol, CID helpers, endpoint identity"
homepage.workspace = true
repository.workspace = true
authors.workspace = true
license.workspace = true
readme.workspace = true
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
blake3 = "1"
cid = { version = "0.11", features = ["serde"] }
dunce = "1"
# `key` gives EndpointId/SecretKey with pure-crypto deps only — no
# tokio/quinn/networking. iroh re-exports these same types, so the node
# crate needs no conversion at the iroh boundary.
iroh-base = { version = "1.0.0", default-features = false, features = ["key"] }
multibase = "0.9"
multihash = "0.19"
postcard = { version = "1", features = ["use-std"] }
radicle = { version = "0.25.1" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
url = { version = "2.5", features = ["serde"] }
walkdir = "2"

[dev-dependencies]
tempfile = "3"
