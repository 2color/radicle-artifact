[package]
name = "radicle-artifact-client"
description = "Control-socket client for the rad-artifact node: sync transport, optional tokio transport"
homepage.workspace = true
repository.workspace = true
authors.workspace = true
license.workspace = true
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[features]
# Async transport for embedders (e.g. Tauri). Adds tokio only — never iroh.
tokio = ["dep:tokio"]

[dependencies]
cid = { version = "0.11", features = ["serde"] }
radicle = { version = "0.24" }
radicle-artifact-core = { version = "0.15.1", path = "../radicle-artifact-core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1", features = ["net", "io-util", "time"], optional = true }

[dev-dependencies]
tempfile = "3"
