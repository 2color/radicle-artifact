[[bin]]
name = "rad-artifact"
path = "src/bin/rad-artifact/main.rs"
# The binary needs CID computation from local paths, which lives in the
# `share` module. Library consumers can still disable `share` to avoid the
# iroh/tokio/blake3 dep tree.
required-features = ["share"]

[package]
name = "radicle-artifact"
description = "Radicle Artifact Collaborative Object (COB)"
homepage.workspace = true
repository.workspace = true
authors.workspace = true
license.workspace = true
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[features]
default = ["share"]
share = [
    "dep:iroh",
    "dep:iroh-blobs",
    "dep:blake3",
    "dep:multihash",
    "dep:tokio",
    "dep:ureq",
    "dep:bytes",
    "dep:walkdir",
    "dep:dunce",
    "dep:indicatif",
    "dep:n0-future",
    "dep:multibase",
    "dep:tracing",
    "dep:tracing-subscriber",
]

[dependencies]
cid = { version = "0.11", features = ["serde"] }
clap = { version = "4.5", features = ["derive", "wrap_help"] }
indexmap = { version = "2.7", features = ["serde"] }
radicle = { version = "0.24" }
radicle-artifact-core = { version = "0.14.0", path = "../radicle-artifact-core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
url = { version = "2.5", features = ["serde"] }

# Optional deps (share feature)
iroh = { version = "1.0.0-rc.1", optional = true }
iroh-blobs = { version = "0.102.0", optional = true }
blake3 = { version = "1", optional = true }
multihash = { version = "0.19", optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "signal", "net", "io-util", "time", "macros", "process", "sync"], optional = true }
ureq = { version = "3", optional = true }
bytes = { version = "1", optional = true }
walkdir = { version = "2", optional = true }
dunce = { version = "1", optional = true }
indicatif = { version = "0.18", optional = true }
inquire = { version = "0.9" }
n0-future = { version = "0.3", optional = true }
multibase = { version = "0.9", optional = true }
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"], optional = true }

[dev-dependencies]
tempfile = "3"

[dev-dependencies.radicle]
version = "0.24"
features = ["test"]
