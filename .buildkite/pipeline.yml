# Steps run in a pinned Rust container so results are reproducible and
# independent of whatever toolchain a given agent happens to have. The
# version tracks `rust-version` in Cargo.toml — bump both together.
#
# fmt and clippy gate the build (cheap, fail fast). The slower test and
# build matrix only runs once they pass.

env:
  RUST_IMAGE: "rust:1.91"
  CARGO_TERM_COLOR: "always"
  # Keep the registry/build cache on the agent between runs.
  CARGO_HOME: ".cargo"

steps:
  - group: ":mag: Lint"
    steps:
      - label: ":rustfmt: fmt"
        command:
          - rustup component add rustfmt
          - cargo fmt --all -- --check
        plugins:
          - docker#v5.11.0:
              image: "$RUST_IMAGE"
              environment:
                - CARGO_TERM_COLOR

      - label: ":clippy: clippy"
        # Lint every feature combination consumers can actually build:
        command:
          - rustup component add clippy
          - cargo clippy --all-targets --all-features -- -D warnings
          - cargo clippy --no-default-features -- -D warnings
        plugins:
          - docker#v5.11.0:
              image: "$RUST_IMAGE"
              environment:
                - CARGO_TERM_COLOR

  - wait: ~

  - label: ":cargo: test"
    command: cargo test --all-features --all-targets
    plugins:
      - docker#v5.11.0:
          image: "$RUST_IMAGE"
          environment:
            - CARGO_TERM_COLOR

  - label: ":books: doc"
    # Catch broken intra-doc links and bad doc comments.
    command: cargo doc --no-deps --all-features
    env:
      RUSTDOCFLAGS: "-D warnings"
    plugins:
      - docker#v5.11.0:
          image: "$RUST_IMAGE"
          environment:
            - CARGO_TERM_COLOR
            - RUSTDOCFLAGS
