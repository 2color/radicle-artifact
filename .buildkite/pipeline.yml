# CI for radicle-artifact. Steps run in a pinned Rust container (the version
# tracks `rust-version` in Cargo.toml — bump both together) sharing a single
# cache volume.
#
# The cache lives outside the checkout (Buildkite's git clean would wipe
# anything inside it) and holds the cargo registry and per-step build output.
# fmt gates the compile steps; clippy, test, doc, and image then run in parallel.
# Each compile step gets its own CARGO_TARGET_DIR to avoid Cargo's file-lock
# contention; all share CARGO_HOME for the registry (Cargo serialises writes
# there internally).

env:
  RUST_IMAGE: "rust:1.91"
  CARGO_TERM_COLOR: "always"

_docker: &docker
  docker#v5.11.0:
    image: "$RUST_IMAGE"
    environment:
      - CARGO_TERM_COLOR
      - CARGO_HOME=/cache/cargo
      - CARGO_TARGET_DIR=/cache/target
    volumes:
      - "rad-artifact-cache:/cache"

steps:
  - label: ":rustfmt: fmt"
    command:
      - rustup component add rustfmt
      - cargo fmt --all -- --check
    plugins:
      - *docker

  - wait: ~

  - label: ":clippy: clippy"
    command:
      - rustup component add clippy
      - cargo clippy --all-targets --all-features -- -D warnings
    plugins:
      - *docker

  - label: ":cargo: test"
    # Plain `cargo test` includes doctests; don't add --all-targets, which
    # silently excludes them.
    command: cargo test --all-features
    plugins:
      - docker#v5.11.0:
          image: "$RUST_IMAGE"
          environment:
            - CARGO_TERM_COLOR
            - CARGO_HOME=/cache/cargo
            - CARGO_TARGET_DIR=/cache/target-test
          volumes:
            - "rad-artifact-cache:/cache"

  - label: ":docker: image"
    command: docker build .

  - label: ":books: doc"
    command: cargo doc --no-deps --all-features
    plugins:
      ## separate target dir so this runs in parallel with clippy and test;
      ## RUSTDOCFLAGS can't go in the shared template
      - docker#v5.11.0:
          image: "$RUST_IMAGE"
          environment:
            - CARGO_TERM_COLOR
            - CARGO_HOME=/cache/cargo
            - CARGO_TARGET_DIR=/cache/target-doc
            - RUSTDOCFLAGS=-D warnings
          volumes:
            - "rad-artifact-cache:/cache"
